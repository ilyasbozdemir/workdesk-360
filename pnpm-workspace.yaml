packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@google/genai': true
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  core-js: set this to true or false
  electron: true
  electron-winstaller: true
  esbuild: true
  javascript-obfuscator: set this to true or false
  prisma: true
  protobufjs: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@google/genai"
  - "better-sqlite3"
  - "electron"
  - "electron-winstaller"
  - "esbuild"
  - "protobufjs"
  - "puppeteer"
  - "sharp"
  - "unrs-resolver"
