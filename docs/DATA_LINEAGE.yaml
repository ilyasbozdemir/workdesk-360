# ------------------------------------------------------------------------------
# 3. KOD DİZİNİ (CODE INDEX)
# ------------------------------------------------------------------------------
codeIndex:
  documentEngine:
    entry: "packages/document-engine/src/DocumentEngine.ts"
    methods:
      - name: "prepare(params)"
        description: "Standart dışa dönük belge hazırlama metodu. loadOrCreateDocument çağırır."
      - name: "loadOrCreateDocument(params)"
        description: "Snapshot'ı okur, yoksa veya kalemler eksikse taze veri derler ve smartMerge uygular."
      - name: "resolveDocumentData(params)"
        description: "TemplateRegistry üzerinden şablon resolver'ını çalıştırır ve antet ile bağlar."
      - name: "compileHtml(params)"
        description: "DocumentRenderer ile tam A4 PDF uyumlu HTML çıktısı üretir."
      - name: "saveDocument(params)"
        description: "Kullanıcı düzenlemelerini DATA_TeminBelgeSnapshot tablosuna yazar."

  templateRegistry:
    entry: "packages/document-engine/src/TemplateRegistry.ts"
    description: "Şablon tanımları, resolver ve renderer eşlemelerinin tutulduğu IoC kayıt defteri."

  defaultDocumentResolver:
    entry: "packages/document-templates/src/engine/resolvers/DefaultDocumentResolver.ts"
    description: "Tüm standart şablonlar için TemplateResolver ve InstitutionalHeaderProvider koordinatörü."

  smartMerge:
    entry: "packages/document-engine/src/mergers/smartMerge.ts"
    description: "Snapshot düzenlemeleri ile canlı veritabanı kalemlerini birleştiren motor."

  desktopPreviewAdapter:
    entry: "apps/temin360-desktop/src/renderer/src/screens/dosya/components/DocumentPreviewModalV3/hooks/helpers/previewDataLoader.ts"
    description: "Desktop UI'ın DocumentEngine.loadOrCreateDocument ile haberleştiği tek yetkili köprü."

# ------------------------------------------------------------------------------
# 4. BİLİNEN KISITLAR VE GEÇMİŞ UYUMLULUK NOTLARI
# ------------------------------------------------------------------------------
knownIssuesAndRules:
  - "Tekil Resolver Yasağı: Artık hiçbir şablon için ayrı SQL resolver sınıfı yazılmamalıdır. data.mapping.ts kullanılmalıdır."
  - "Kanonik Alan Kuralı: Kalem listeleri için 'ihtiyacKalemleri' kanonik alandır. Uyumluluk için 'kalemler' ve 'items' otomatik alias olarak sağlanır."
  - "Tarih Formatı: Belgelerde tarihler daima DD.MM.YYYY (formatDateTR) olarak gösterilir."
  - "UI Katmanı SQL Yasağı: DocumentPreviewModalV3 veya alt bileşenleri doğrudan db:query ile belge verisi çözemez. Tüm veriler DocumentEngine üzerinden yüklenmelidir."

