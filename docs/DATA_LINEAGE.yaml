# ==============================================================================
# WORKDESK 360 / TEMİN 360 — MERKEZİ VERİ VE KOD REHBERİ (DATA LINEAGE)
# ==============================================================================
# Bu dosya, monorepo genelindeki SQLite veri kaynaklarını, Document Engine
# çözümleme kurallarını, şablon sözleşmelerini ve ilgili kod yollarını belgeler.
#
# Mimari İlkeler:
# 1. Template = Talimat ve görünüm (Görsel ve şema kontratı)
# 2. Document Engine = Talimatları çalıştıran tek genel motor (@worksuite-360/document-engine)
# 3. Data Adapter = Veritabanı işlemleri (IPC ve queryExecutor adaptörleri)
# 4. Domain Services = Ortak iş kuralları (@temin360/contracts, rota, antet)
# 5. PDF Generator = Bağımsız çıktı üretimi (@temin360/pdf-generator)
# ==============================================================================

version: "1.0.0"
lastUpdated: "2026-11-10"
system: "WorkDesk 360 / Temin 360 Monorepo"

# ------------------------------------------------------------------------------
# 1. VERİ GRUPLARI VE ÇÖZÜMLEME ZİNCİRİ
# ------------------------------------------------------------------------------
dataGroups:
  kurumVeBirimler:
    title: "Kurum ve Birimler"
    description: "İdare antet hiyerarşisi, harcama birimi, müdürlük ve ihtiyaç yeri verileri."
    sourceTables:
      - table: "TANIM_Kurum"
        columns: ["id", "kurum_adi", "ust_kurum_adi", "kurum_anteti", "antet_metni", "makam_adi", "logo_sol", "logo_sag", "adres", "telefon", "faks", "web_sitesi", "eposta", "kep_adresi", "kurum_tipi", "alt_kurum_tipi", "alt_kurum_bizim", "alt_kurum_bulunma"]
      - table: "TANIM_Birim"
        columns: ["id", "ad", "birim_adi", "kisa_ad", "sunum_makami", "antet_ek_satir", "harcama_yetkilisi_id", "harcama_yetkilisi_unvan", "aktif_mi"]
    engineEntryPoints:
      - "InstitutionalHeaderProvider.resolve(dosyaId, queryExecutor)"
      - "InstitutionalHeaderProvider.resolveBirimAntet(input, queryExecutor)"
    sourceFiles:
      - "packages/document-engine/src/providers/InstitutionalHeaderProvider.ts"
      - "packages/document-templates/src/resolver/helpers/resolveAntetSatirlari.ts"
      - "packages/document-templates/src/resolver/helpers/resolveSingleColumn.ts"
    fallbackPriority:
      1: "DATA_TeminDosyasi.birim_id üzerinden seçili TANIM_Birim antet_ek_satir veya birim_adi"
      2: "TANIM_Kurum aktif kurum_anteti (JSON dizi veya satır satır metin)"
      3: "settings tablosundaki activeKurumId / institutionName"
      4: "Sabit varsayılan: ['T.C.', 'İDARE BAŞKANLIĞI']"
    consumingTemplates: "Tüm 32 şablon (kurumsal üst veri olarak)"
    snapshotBehavior: "Header alanları (antetSatirlari, mudurluk, logolar) rebase sırasında kaynaktan yenilenir; manuel antet metinleri smartMerge ile korunur."

  personelVeRoller:
    title: "Personel ve Roller"
    description: "Hazırlayan, talep eden, onaylayan (Harcama Yetkilisi), gerçekleştirme görevlisi ve komisyon üyeleri."
    sourceTables:
      - table: "TANIM_Personel"
        columns: ["id", "ad_soyad", "unvan", "telefon", "eposta", "birim", "birim_id", "sicil_no", "aktif_mi"]
      - table: "DATA_TeminDosyasi"
        columns: ["hazirlayan_personel_id", "sunan_personel_id", "talep_eden_personel_id", "onay_personel_id", "harcama_yetkilisi_id", "harcama_yetkilisi_unvan"]
    engineEntryPoints:
      - "DefaultDocumentResolver.resolve(context)"
      - "InstitutionalHeaderProvider.resolve(dosyaId, queryExecutor)"
      - "resolveCommissionMembers(sablonDegiskeni, dosyaId, templateId, queryExecutor)"
    sourceFiles:
      - "packages/document-templates/src/engine/resolvers/DefaultDocumentResolver.ts"
      - "packages/document-engine/src/providers/InstitutionalHeaderProvider.ts"
      - "packages/document-templates/src/resolver/helpers/resolveCommissionMembers.ts"
    fallbackPriority:
      1: "DATA_TeminDosyasi üzerindeki ilgili personel foreign key'i (hazirlayan_personel_id, onay_personel_id vb.)"
      2: "TANIM_Birim üzerindeki harcama_yetkilisi_id"
      3: "TANIM_Personel tablosundaki aktif_mi = 1 olan ilk personel"
      4: "Kullanıcı profil oturumu (auth store)"
    consumingTemplates: "ihtiyac-listesi, ihtiyac-talep-formu, luzum-muzekkeresi, harcama-talimati, piyasa-fiyat-arastirma-tutanagi, komisyon-* vb."
    snapshotBehavior: "Kullanıcı modal üzerinden personel veya unvanı elle değiştirdiyse snapshot değeri korunur (smartMerge preserves manual edits)."

  dosyaBilgileri:
    title: "Dosya Bilgileri"
    description: "Temin dosya numarası, açılış tarihi, konusu, alım türü, ihale usulü ve işin açıklaması."
    sourceTables:
      - table: "DATA_TeminDosyasi"
        columns: ["id", "temin_no", "dosya_no", "konu", "isin_aciklamasi", "dosya_acilis_tarihi", "temin_tarihi", "ihale_sekli", "tur", "alim_turu", "sunulacak_makam", "ihtiyac_yeri", "yaklasik_maliyet", "durum"]
    engineEntryPoints:
      - "TemplateResolver.resolve(mapping, dosyaId, templateKey)"
      - "DefaultDocumentResolver.resolve(context)"
    sourceFiles:
      - "packages/document-templates/src/resolver/TemplateResolver.ts"
      - "packages/document-templates/src/resolver/mappingResolver.ts"
    fallbackPriority:
      1: "DATA_TeminDosyasi canlı kolon değeri"
      2: "data.mapping.ts içindeki varsayilan kuralı"
      3: "Günün tarihi (tarihler için) veya boş string"
    consumingTemplates: "Tüm şablonlar"
    snapshotBehavior: "Dosya konusu, tarihi ve numarası snapshot'ta saklanır; veri tabanı güncellense dahi rebase kurallarına göre korunur."

  ihtiyacKalemleri:
    title: "İhtiyaç Kalemleri"
    description: "Alımı yapılacak mal, hizmet, yapım işi veya danışmanlık kalemleri; miktar, birim, taşınır/poz kodları, KDV oranları."
    sourceTables:
      - table: "DATA_TeminKalem"
        columns: ["id", "temin_dosya_id", "sira_no", "kalem_adi", "aciklama", "tasinir_kodu", "poz_no", "hizmet_kodu", "poz_tanimi", "birim", "olcu_birimi", "miktar", "kdv_orani"]
      - table: "TANIM_Kalem"
        columns: ["id", "kalem_adi", "tasinir_kodu", "ozelligi", "birim"]
    engineEntryPoints:
      - "resolveTableArray(rule, activeDosyaId, queryExecutor, resolvedPayload, sablonDegiskeni, templateId)"
      - "normalizeIhtiyacKalemleri(data)"
      - "paginateData(items, limits)"
    sourceFiles:
      - "packages/document-templates/src/resolver/helpers/resolveTableArray.ts"
      - "packages/document-templates/src/templates/ihtiyac-listesi/IhtiyacListesi.hook.ts"
      - "packages/document-templates/src/templates/ihtiyac-talep-formu/IhtiyacTalepFormu.hook.ts"
    canonicalFields:
      primary: "ihtiyacKalemleri"
      aliases: ["kalemler", "items", "malzemeler"]
    fallbackPriority:
      1: "DATA_TeminKalem doğrudan dosya kayıtları"
      2: "TANIM_Kalem tablosu ile eşleşen özellik/açıklama zenginleştirmesi"
      3: "Snapshot'taki mevcut kalem listesi (smartMerge yeni eklenen kalemleri rebase ile ekler)"
    consumingTemplates: "ihtiyac-listesi, ihtiyac-talep-formu, luzum-muzekkeresi, teknik-sartname, piyasa-fiyat-arastirma-tutanagi, yaklasik-maliyet-cetveli"
    snapshotBehavior: "Kullanıcının tabloda elle değiştirdiği metinler korunur; dosyaya yeni kalem eklendiğinde smartMerge kaybolmadan yeni kalemi listeye katar."

  firmalarVeTeklifler:
    title: "Firmalar ve Teklifler"
    description: "Davet edilen firmalar, teklif mektupları, birim fiyatlar ve en uygun teklif hesaplamaları."
    sourceTables:
      - table: "DATA_TeminFirma"
        columns: ["id", "temin_dosya_id", "firma_id", "unvan", "vergi_no", "adres", "telefon", "email"]
      - table: "TANIM_Firma"
        columns: ["id", "unvan", "vergi_no", "adres", "telefon", "email"]
      - table: "DATA_TeminKalemTeklif"
        columns: ["id", "temin_dosya_id", "temin_kalem_id", "temin_firma_id", "birim_fiyat", "kdv_haric_toplam"]
    engineEntryPoints:
      - "resolveTableArray (needsFirms = true olduğunda)"
      - "PiyasaAraştırma ve Yaklaşık Maliyet data.mapping.ts kuralları"
    sourceFiles:
      - "packages/document-templates/src/resolver/helpers/resolveTableArray.ts"
    fallbackPriority:
      1: "DATA_TeminFirma ve DATA_TeminKalemTeklif canlı teklifleri"
      2: "TANIM_Firma genel firma rehberi"
    consumingTemplates: "piyasa-fiyat-arastirma-tutanagi, yaklasik-maliyet-cetveli, birim-fiyat-teklif-mektubu, kabul-edilen-teklif, dogrudan-temin-sozlesmesi"
    snapshotBehavior: "Kullanıcının girdiği özel teklif notları snapshot'ta korunur."

  komisyonlar:
    title: "Komisyonlar ve Görevlendirmeler"
    description: "Piyasa fiyat araştırma komisyonu, muayene ve kabul komisyonu, ihale komisyonu üyeleri ve başkan."
    sourceTables:
      - table: "DATA_TeminKomisyon"
        columns: ["id", "temin_dosya_id", "komisyon_turu", "karar_no", "karar_tarihi"]
      - table: "DATA_TeminKomisyonUye"
        columns: ["id", "komisyon_id", "personel_id", "gorev", "unvan", "asil_yedek"]
      - table: "TANIM_Personel"
        columns: ["id", "ad_soyad", "unvan"]
    engineEntryPoints:
      - "resolveCommissionMembers(sablonDegiskeni, activeDosyaId, templateId, queryExecutor, resolvedPayload)"
    sourceFiles:
      - "packages/document-templates/src/resolver/helpers/resolveCommissionMembers.ts"
    consumingTemplates: "komisyon-gorevlendirme-onayi, piyasa-fiyat-arastirma-tutanagi, muayene-kabul-komisyonu, muayene-kabul-tutanagi"
    snapshotBehavior: "Komisyon unvan ve sıralamaları snapshot ile korunur."

  antetVeLogolar:
    title: "Antet ve Logolar"
    description: "Sol logo, sağ logo, T.C. ibaresi, idare hiyerarşi satırları."
    sourceTables:
      - table: "TANIM_Kurum"
        columns: ["logo_sol", "logo_sag", "kurum_anteti", "kurum_adi"]
      - table: "settings"
        columns: ["key", "value"]
    engineEntryPoints:
      - "InstitutionalHeaderProvider.resolve(dosyaId, queryExecutor)"
    sourceFiles:
      - "packages/document-engine/src/providers/InstitutionalHeaderProvider.ts"
    consumingTemplates: "Tüm şablonlar (DocumentLayout başlığında)"

  imzaVeRota:
    title: "İmza ve Rota Akışı"
    description: "Belgenin paraf, imza, onay rota hiyerarşisi (ÜstYazı / Onay)."
    engineEntryPoints:
      - "resolveTemplateRouteForDocument(templateKey, dosyaId)"
      - "ApprovalSignature bileşeni"
    sourceFiles:
      - "apps/temin360-desktop/src/renderer/src/services/rotaDefaultsService.ts"
      - "packages/document-templates/src/document/ApprovalSignature.tsx"

  snapshotVeManuelDuzenlemeler:
    title: "Snapshot ve Manuel Düzenlemeler"
    description: "Kullanıcının modal üzerinde doğrudan Word gibi düzenlediği verilerin SQLite'ta saklanması ve akıllı birleştirilmesi."
    sourceTables:
      - table: "DATA_TeminBelgeSnapshot"
        columns: ["id", "temin_dosya_id", "sablon_kodu", "belge_snapshot_json", "sablon_versiyon", "guncelleme_tarihi"]
    engineEntryPoints:
      - "DocumentEngine.loadOrCreateDocument(params)"
      - "DocumentEngine.saveDocument(params)"
      - "smartMergeDocumentData(existingSnapshot, freshSourceData)"
    sourceFiles:
      - "packages/document-engine/src/DocumentEngine.ts"
      - "packages/document-engine/src/mergers/smartMerge.ts"

