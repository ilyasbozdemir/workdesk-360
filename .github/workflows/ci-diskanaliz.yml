name: CI (Disk Analiz 360 - Disk ve Tekilleştirme)

on:
  push:
    branches:
      - 'module/disk-analiz'
      - 'module/disk**'
    paths:
      - 'apps/disk-analiz-360-desktop/**'
  pull_request:
    branches:
      - 'module/disk-analiz'
    paths:
      - 'apps/disk-analiz-360-desktop/**'

jobs:
  test-diskanaliz:
    name: Disk Analiz 360 Typecheck
    runs-on: windows-2022
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_msvs_version: "2022"

      - name: Typecheck Disk Analiz 360
        run: |
          pnpm --filter disk-analiz-360-desktop typecheck
