name: Build and Release

on:
  push:
    tags:
      - "v*"
      - "temin360-v*"
      - "workdesk-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          RAW_TAG=${GITHUB_REF_NAME}
          # Strip prefix if any (e.g. temin360-v1.0.0 -> 1.0.0, v1.0.0 -> 1.0.0)
          VERSION=$(echo "$RAW_TAG" | sed -E 's/^.*v//')
          echo "Building release for version: $VERSION (from tag: $RAW_TAG)"
          cd apps/app-desktop
          npm pkg set version=$VERSION

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_msvs_version: "2022"

      - name: Verify ee-first
        shell: cmd
        run: |
          cd apps/app-desktop
          pnpm ls ee-first
          if exist node_modules\ee-first (
            echo FOUND
          ) else (
            echo MISSING
            exit 1
          )

      - name: Build Database Package
        run: pnpm --filter @dt/database build

      - name: Pre-release Integrity & Schema Checks
        run: |
          pnpm check:schema
          pnpm --filter app-desktop typecheck:node
          pnpm --filter app-desktop typecheck:web

      - name: Pre-release Unit & Integration Tests
        run: |
          pnpm --filter @temin360/document-templates test
          pnpm --filter app-desktop test

      - name: Build and Package
        working-directory: apps/app-desktop
        run: pnpm build && npx electron-builder --win --x64 -p never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://cdn.npmmirror.com/binaries/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://cdn.npmmirror.com/binaries/electron-builder-binaries/"

      - name: Prepare Release Notes
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == *"rc"* ]]; then
            echo "RELEASE_NAME=TEMİN 360 ${{ github.ref_name }} (Sürüm Adayı)" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "MAKE_LATEST=false" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == *"beta"* || "${{ github.ref_name }}" == *"alpha"* ]]; then
            echo "RELEASE_NAME=TEMİN 360 ${{ github.ref_name }} (Erken Erişim)" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "MAKE_LATEST=false" >> $GITHUB_ENV
          else
            echo "RELEASE_NAME=TEMİN 360 ${{ github.ref_name }}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "MAKE_LATEST=true" >> $GITHUB_ENV
          fi
          node apps/app-desktop/scripts/generate-release-notes.js "${{ github.ref_name }}" release_notes.md

      - name: Release Files
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/app-desktop/dist-local/*.exe
            apps/app-desktop/dist-local/*.exe.blockmap
            apps/app-desktop/dist-local/*.yml
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST }}
          name: ${{ env.RELEASE_NAME }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
