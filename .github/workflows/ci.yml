name: CI (Workdesk 360 Monorepo - Genel Main)

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Monorepo Schema, Typecheck & Tests (Apps & Packages)
    runs-on: windows-2022
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_msvs_version: "2022"

      - name: Build Database Package
        run: pnpm --filter @dt/database build

      - name: Database Schema & Snapshot Parity Check
        run: pnpm check:schema

      - name: Typecheck Apps & Packages
        run: |
          pnpm --filter @temin360/document-templates typecheck
          pnpm --filter temin360-desktop typecheck:node
          pnpm --filter temin360-desktop typecheck:web
          pnpm --filter ihale360-desktop typecheck:node
          pnpm --filter ihale360-desktop typecheck:web
          pnpm --filter devlet-ihale-2886-desktop typecheck:node
          pnpm --filter devlet-ihale-2886-desktop typecheck:web
          pnpm --filter app-workspace typecheck

      - name: Run Unit & Integration Tests
        run: |
          pnpm --filter @temin360/document-templates test
          pnpm --filter temin360-desktop test
          pnpm --filter ihale360-desktop test
          pnpm --filter devlet-ihale-2886-desktop test
          pnpm --filter app-workspace test

      - name: Build All Core Apps
        run: |
          pnpm --filter temin360-desktop build
          pnpm --filter ihale360-desktop build
          pnpm --filter devlet-ihale-2886-desktop build

      - name: Run Electron E2E Tests
        run: pnpm --filter temin360-desktop test:e2e

      - name: Upload E2E Test Artifacts and Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            apps/temin360-desktop/test-results/
            apps/temin360-desktop/e2e-report/
            apps/temin360-desktop/e2e-screenshots/
          retention-days: 14
