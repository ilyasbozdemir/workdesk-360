name: CI (Workdesk 360 Monorepo - Genel Main)

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Monorepo Schema, Typecheck & Tests (Apps & Packages)
    runs-on: windows-2022
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: |
          $maxAttempts = 3
          $attempt = 0
          $success = $false
          while (-not $success -and $attempt -lt $maxAttempts) {
            $attempt++
            Write-Host "==> pnpm install attempt $attempt of $maxAttempts..."
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) {
              $success = $true
            } else {
              if ($attempt -lt $maxAttempts) {
                Write-Host "pnpm install failed (network / timeout). Retrying in 15s..."
                Start-Sleep -Seconds 15
              } else {
                Write-Error "pnpm install failed after $maxAttempts attempts."
                exit 1
              }
            }
          }
        env:
          npm_config_msvs_version: "2022"

      - name: Build Database Package
        run: pnpm --filter @dt/database build

      - name: Database Schema & Snapshot Parity Check
        run: pnpm check:schema

      - name: Typecheck Apps & Packages
        run: |
          pnpm --filter @temin360/document-templates typecheck
          pnpm --filter temin360-desktop typecheck:node
          pnpm --filter temin360-desktop typecheck:web
          pnpm --filter ihale360-desktop typecheck:node
          pnpm --filter ihale360-desktop typecheck:web
          pnpm --filter flowdesk-desktop typecheck
          pnpm --filter app-workspace typecheck

      - name: Run Unit & Integration Tests
        run: |
          pnpm --filter @temin360/document-templates test
          pnpm --filter temin360-desktop test
          pnpm --filter ihale360-desktop test
          pnpm --filter flowdesk-desktop test
          pnpm --filter app-workspace test

      - name: Build All Core Apps
        run: |
          pnpm --filter temin360-desktop build
          pnpm --filter ihale360-desktop build
          pnpm --filter flowdesk-desktop build

      - name: Run Electron E2E Tests
        run: pnpm --filter temin360-desktop test:e2e

      - name: Upload E2E Test Artifacts and Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            apps/temin360-desktop/test-results/
            apps/temin360-desktop/e2e-report/
            apps/temin360-desktop/e2e-screenshots/
          retention-days: 14
