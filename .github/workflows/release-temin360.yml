name: Release Temin 360

on:
  push:
    tags:
      - "temin360-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Temin 360 Desktop
    runs-on: windows-2022
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Sync version with tag
        shell: bash
        run: |
          RAW_TAG=${GITHUB_REF_NAME}
          VERSION=$(echo "$RAW_TAG" | sed -E 's/^temin360-v//')
          echo "Building Temin 360 version: $VERSION (from tag: $RAW_TAG)"
          cd apps/temin360-desktop
          npm pkg set version=$VERSION

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_msvs_version: "2022"

      - name: Build Database Package
        run: pnpm --filter @dt/database build

      - name: Pre-release Checks
        run: |
          pnpm check:schema
          pnpm --filter @temin360/document-templates typecheck
          pnpm --filter temin360-desktop typecheck:node
          pnpm --filter temin360-desktop typecheck:web
          pnpm --filter @temin360/document-templates test
          pnpm --filter temin360-desktop test

      - name: Build and Package Temin 360
        working-directory: apps/temin360-desktop
        run: pnpm build && npx electron-builder --win --x64 -p never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://cdn.npmmirror.com/binaries/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://cdn.npmmirror.com/binaries/electron-builder-binaries/"

      - name: Prepare Release Metadata
        id: prep
        shell: bash
        run: |
          RAW_TAG=${GITHUB_REF_NAME}
          VERSION=$(echo "$RAW_TAG" | sed -E 's/^temin360-v//')
          if [[ "$RAW_TAG" == *"rc"* ]]; then
            echo "release_name=TEMİN 360 v$VERSION (Sürüm Adayı)" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT
          elif [[ "$RAW_TAG" == *"beta"* || "$RAW_TAG" == *"alpha"* ]]; then
            echo "release_name=TEMİN 360 v$VERSION (Erken Erişim)" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT
          else
            echo "release_name=TEMİN 360 v$VERSION" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
          fi
          node apps/temin360-desktop/scripts/generate-release-notes.js "v$VERSION" release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/temin360-desktop/dist-local/*.exe
            apps/temin360-desktop/dist-local/*.exe.blockmap
            apps/temin360-desktop/dist-local/*.yml
          draft: false
          prerelease: ${{ steps.prep.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.prep.outputs.make_latest }}
          name: ${{ steps.prep.outputs.release_name }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
