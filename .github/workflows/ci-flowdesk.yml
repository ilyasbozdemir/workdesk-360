name: CI (FlowDesk 360 - Dinamik Süreç Motoru)

on:
  push:
    branches:
      - 'module/flowdesk'
      - 'module/flowdesk**'
    paths:
      - 'apps/flowdesk-desktop/**'
      - 'packages/ecosystem-contracts/**'
  pull_request:
    branches:
      - 'module/flowdesk'
    paths:
      - 'apps/flowdesk-desktop/**'
      - 'packages/ecosystem-contracts/**'

jobs:
  test-flowdesk:
    name: FlowDesk 360 Typecheck & Unit Tests
    runs-on: windows-2022
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_msvs_version: "2022"

      - name: Typecheck FlowDesk 360
        run: |
          pnpm --filter flowdesk-desktop typecheck

      - name: Run FlowDesk Tests
        run: |
          pnpm --filter flowdesk-desktop test
