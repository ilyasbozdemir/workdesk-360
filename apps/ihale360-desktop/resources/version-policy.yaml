# Temin 360 - Merkezi Sürüm ve Release Politikası
# Bu yapılandırma dosyası tüm kanalları, geçiş kurallarını ve sürüm politikalarını tek bir merkezde tanımlar.

versioning:
  scheme: semver

  # Desteklenen kanallar (öncelik sırasıyla: alpha < beta < rc < stable)
  channels:
    - alpha
    - beta
    - rc
    - stable

  # Kanal öncelik sıralaması
  channelOrder:
    alpha: 1
    beta: 2
    rc: 3
    stable: 4

  # Varsayılan kanal
  defaultChannel: rc

  # Git etiket öneki
  tagPrefix: 'v'

  # Güncelleme ve prerelease kuralları
  prerelease:
    allowAutoUpdate: true
    allowChannelUpgrade: true    # Örn: beta -> rc, rc -> stable geçişine izin verilir
    allowChannelDowngrade: false  # Örn: rc -> beta veya stable -> rc düşürmesi engellenir

  # Kanal meta verileri (Changelog başlıkları, açıklamalar ve etiketler)
  channelMeta:
    alpha:
      name: 'Alpha'
      label: 'Geliştirici / Alpha Sürümü'
      header: '🚀 **TEMİN 360 {tag} (Geliştirici / Alpha Sürümü)**'
      description: 'Geliştirme aşamasındaki deneysel sürümdür.'
      isPrerelease: true
    beta:
      name: 'Beta'
      label: 'Erken Erişim (Early Access)'
      header: '🚀 **TEMİN 360 {tag} (Erken Erişim / Early Access)**'
      description: 'Bu sürümdeki en son değişiklikler ve geliştirmeler aşağıda listelenmiştir.'
      isPrerelease: true
    rc:
      name: 'Release Candidate'
      label: 'Sürüm Adayı (Release Candidate)'
      header: '🎯 **TEMİN 360 {tag} (Sürüm Adayı / Release Candidate)**'
      description: 'Kararlı sürüm öncesi test ve doğrulama sürümüdür. Bu sürümdeki değişiklikler aşağıda listelenmiştir.'
      isPrerelease: true
    stable:
      name: 'Stable'
      label: 'Kararlı Sürüm'
      header: '⚖️ **TEMİN 360 {tag} (Kararlı Sürüm)**'
      description: 'Kamu Harcama, İhale, Doğrudan Temin ve Hakediş Yönetim Sistemi.'
      isPrerelease: false
