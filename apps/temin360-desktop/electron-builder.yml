appId: dev.ilyasbozdemir.temin360
productName: TEMİN 360
fileAssociations:
  - ext: temin
    name: TEMİN 360 Proje Dosyası
    description: TEMİN 360 Doğrudan Temin Proje Dosyası (*.temin)
    role: Editor
    mimeType: application/x-temin
    icon: icon.ico
  - ext: hkmp
    name: HakimPro Doğrudan Temin Dosyası
    description: HakimPro Doğrudan Temin Dosyası (*.hkmp)
    role: Viewer
    mimeType: application/x-hkmp
    icon: icon.ico
  - ext: tmn360
    name: Temin 360 Arşiv Dosyası
    description: Temin 360 Arşiv Dosyası (*.tmn360)
    role: Viewer
    mimeType: application/x-temin360
    icon: icon.ico
directories:
  buildResources: build
  output: dist-local

files:
  - out/**/*
  - package.json
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: resources/
    to: .
    filter:
      - '**/*'

win:
  executableName: TEMIN360
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: TEMİN 360
  uninstallDisplayName: TEMİN 360
  createDesktopShortcut: always
  include: build/installer.nsh
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: true
publish:
  provider: github
  owner: ilyasbozdemir
  repo: workdesk-360
  updaterCacheDirName: workdesk-360-updater
